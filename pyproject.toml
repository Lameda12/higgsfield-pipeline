[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "higgsfield-pipeline"
version = "0.1.0"
description = "Agentic content pipeline: product URL in, campaign-ready assets out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "anthropic>=0.64",
    "mcp>=1.0",
    "higgsfield-client>=0.1",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
